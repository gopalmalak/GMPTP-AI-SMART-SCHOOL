name: Build Demo APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle System
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Environment Placeholder
        run: |
          touch .env
          echo "MAPS_API_KEY=AIzaSyDemoFallbackKey" >> .env

      - name: Absolute Overwrite Invalid Syntax & Signing Bypass
        run: |
          # 1. Turn off the restrictive configuration cache entirely
          if [ -f "gradle.properties" ]; then
            sed -i 's/org.gradle.configuration-cache=true/org.gradle.configuration-cache=false/g' gradle.properties
            sed -i 's/kotlin.compiler.execution.strategy=in-process/# strategy bypass/g' gradle.properties
          fi
          
          # 2. Hard replace the broken compileSdk function block with standard direct assignment using standard python inline tool
          python3 -c '
          with open("app/build.gradle.kts", "r") as f:
              content = f.read()
          
          # Locate the complete invalid function string block and clear it cleanly
          bad_syntax = "compileSdk { version = release(36) { minorApiLevel = 1 } }"
          fixed_content = content.replace(bad_syntax, "compileSdk = 36")
          
          with open("app/build.gradle.kts", "w") as f:
              f.write(fixed_content)
          '
          
          # 3. Double verify targetSdk configs and completely disable signing barriers
          sed -i 's/targetSdk = 36/targetSdk = 36/g' app/build.gradle.kts
          sed -i 's/signingConfig = signingConfigs.getByName("release")/\/\/ bypassed release signing/g' app/build.gradle.kts
          sed -i 's/signingConfig = signingConfigs.getByName("debugConfig")/\/\/ bypassed debug signing/g' app/build.gradle.kts

      - name: Clean and Assemble Debug APK Bundle
        run: gradle clean app:assembleDebug -x test --stacktrace --no-daemon --no-configuration-cache

      - name: Upload Demo APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GMPTP-AI-Demo-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
