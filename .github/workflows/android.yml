name: Build Demo APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle System
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Environment Placeholder
        run: |
          touch .env
          echo "MAPS_API_KEY=AIzaSyDemoFallbackKey" >> .env

      - name: Hard Reset Invalid Syntax & Disable Cache
        run: |
          # 1. Kill the restrictive Configuration Cache forcing the error repeat
          if [ -f "gradle.properties" ]; then
            sed -i 's/org.gradle.configuration-cache=true/org.gradle.configuration-cache=false/g' gradle.properties
            sed -i 's/kotlin.compiler.execution.strategy=in-process/# strategy bypass/g' gradle.properties
          fi
          
          # 2. Force overwrite the entire invalid compileSdk line with standard clean Android configuration
          sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 36/g' app/build.gradle.kts
          sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 36/g' app/build.gradle.kts || true
          
          # 3. Bypass release and debug signing configs to ensure clean output
          sed -i 's/signingConfig = signingConfigs.getByName("release")/\/\/ bypassed release signing/g' app/build.gradle.kts
          sed -i 's/signingConfig = signingConfigs.getByName("debugConfig")/\/\/ bypassed debug signing/g' app/build.gradle.kts

      - name: Clean and Build Unsigned Demo APK
        run: gradle clean app:assembleDebug -x test --stacktrace --no-daemon --no-configuration-cache

      - name: Upload Demo APK
        uses: actions/upload-artifact@v4
        with:
          name: GMPTP-AI-Demo-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
