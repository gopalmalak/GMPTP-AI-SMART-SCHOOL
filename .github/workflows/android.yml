name: Build Demo APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle System
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Environment Placeholder
        run: |
          touch .env
          echo "MAPS_API_KEY=AIzaSyDemoFallbackKey" >> .env

      - name: Auto-Fix Compile Strategy & Build Properties
        run: |
          # 1. Clean the restrictive compiler execution strategy causing cloud process blocks
          if [ -f "gradle.properties" ]; then
            sed -i 's/kotlin.compiler.execution.strategy=in-process/# bypassed strategy/g' gradle.properties
          fi
          
          # 2. Fix the invalid compileSdk function syntax in build.gradle.kts
          sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 36/g' app/build.gradle.kts
          sed -i 's/targetSdk = 36/targetSdk = 36/g' app/build.gradle.kts

          # 3. Bypass release and debug signing configs
          sed -i 's/signingConfig = signingConfigs.getByName("release")/\/\/ bypassed release signing/g' app/build.gradle.kts
          sed -i 's/signingConfig = signingConfigs.getByName("debugConfig")/\/\/ bypassed debug signing/g' app/build.gradle.kts

      - name: Build Unsigned Demo APK
        run: gradle app:assembleDebug -x test --stacktrace --no-daemon

      - name: Upload Demo APK
        uses: actions/upload-artifact@v4
        with:
          name: GMPTP-AI-Demo-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
