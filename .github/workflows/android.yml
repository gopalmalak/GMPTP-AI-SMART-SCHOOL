name: Build Demo APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle System
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Environment Placeholder
        run: |
          touch .env
          echo "MAPS_API_KEY=AIzaSyDemoFallbackKey" >> .env

      - name: Absolute Fix Kotlin DSL Syntax & Overwrite File
        run: |
          # 1. Turn off configuration cache to reset state
          if [ -f "gradle.properties" ]; then
            sed -i 's/org.gradle.configuration-cache=true/org.gradle.configuration-cache=false/g' gradle.properties
            sed -i 's/kotlin.compiler.execution.strategy=in-process/# strategy bypass/g' gradle.properties
          fi
          
          # 2. Complete hard-overwrite of the build.gradle.kts with perfect standard clean syntax
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              alias(libs.plugins.android.application)
              alias(libs.plugins.kotlin.compose)
              alias(libs.plugins.google.devtools.ksp)
              alias(libs.plugins.roborazzi)
              alias(libs.plugins.secrets)
              alias(libs.plugins.google.services)
          }

          android {
              namespace = "com.example"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.aistudio.gmptpai.kzvqmw"
                  minSdk = 24
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
                  debug {
                      // Bypass debugging configs securely
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_11
                  targetCompatibility = JavaVersion.VERSION_11
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }

              testOptions {
                  unitTests {
                      isIncludeAndroidResources = true
                  }
              }
          }

          dependencies {
              implementation(platform(libs.androidx.compose.bom))
              implementation(platform(libs.firebase.bom))
              implementation(libs.androidx.activity.compose)
              implementation(libs.androidx.biometric)
              implementation(libs.androidx.compose.material.icons.core)
              implementation(libs.androidx.compose.material.icons.extended)
              implementation(libs.androidx.compose.material3)
              implementation(libs.androidx.compose.ui)
              implementation(libs.androidx.compose.ui.graphics)
              implementation(libs.androidx.compose.ui.tooling.preview)
              implementation(libs.androidx.core.ktx)
              implementation(libs.androidx.lifecycle.runtime.compose)
              implementation(libs.androidx.lifecycle.runtime.ktx)
              implementation(libs.androidx.lifecycle.viewmodel.compose)
              implementation(libs.androidx.room.ktx)
              implementation(libs.androidx.room.runtime)
              implementation(libs.converter.moshi)
              implementation(libs.firebase.ai)
              implementation(libs.firebase.firestore)
              implementation(libs.firebase.auth)
              implementation(libs.androidx.credentials)
              implementation(libs.androidx.credentials.play.services)
              implementation(libs.googleid)
              implementation(libs.firebase.appcheck.recaptcha)
              implementation(libs.firebase.appcheck.debug)
              implementation(libs.kotlinx.coroutines.android)
              implementation(libs.kotlinx.coroutines.core)
              implementation(libs.logging.interceptor)
              implementation(libs.moshi.kotlin)
              implementation(libs.okhttp)
              implementation(libs.play_services_location)
              implementation(libs.play_services_maps)
              implementation(libs.maps.compose)
              implementation(libs.retrofit)
              
              "ksp"(libs.androidx.room.compiler)
              "ksp"(libs.moshi.kotlin.codegen)
          }
          EOF

      - name: Clean and Assemble Debug APK
        run: gradle clean app:assembleDebug -x test --stacktrace --no-daemon --no-configuration-cache

      - name: Upload Demo APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GMPTP-AI-Demo-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
