name: Build Demo APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle System
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Environment Placeholder
        run: |
          touch .env
          echo "MAPS_API_KEY=AIzaSyDemoFallbackKey" >> .env

      - name: Disable Missing Keystore & Bypass Crash
        run: |
          # Enforce passthrough on missing google-services.json and completely disable release signing restrictions
          sed -i 's/signingConfig = signingConfigs.getByName("release")/\/\/ bypassed release signing/g' app/build.gradle.kts
          sed -i 's/signingConfig = signingConfigs.getByName("debugConfig")/\/\/ bypassed debug signing/g' app/build.gradle.kts

      - name: Build Unsigned Debug APK
        run: gradle assembleDebug -x test --stacktrace --no-daemon

      - name: Upload Demo APK
        uses: actions/upload-artifact@v4
        with:
          name: GMPTP-AI-Demo-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
